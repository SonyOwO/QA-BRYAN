name: CI demo
on: [push, pull_request]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint simulado
        run: echo "lint ok" > lint.txt
      - name: Pruebas simuladas
        run: echo "tests ok" > tests.txt
      - name: Publicar evidencia
        uses: actions/upload-artifact@v4
        with:
          name: evidencia
          path: |
            lint.txt
            tests.txt
